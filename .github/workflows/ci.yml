name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type-check
        run: mypy src
      - name: Offline tests
        run: pytest -q --ignore=tests/integration
      - name: Report integration availability
        run: pytest -q tests/integration -rs
      - name: Install merged taxonomy contract
        run: >-
          pip install
          "ta-taxonomies @ git+https://github.com/LFX-Talent-Angels/TA-taxonomies.git@8fbf5e489379cf761345d6ec3cdefb68d1578c78"
      - name: Verify taxonomy contract compatibility
        run: pytest -q tests/integration/test_taxonomy_contract.py
